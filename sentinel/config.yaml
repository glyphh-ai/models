# Sentinel Security Model
# Discovers attack chains from disconnected security events.
# Uses MITRE ATT&CK HDC encoding + Ada's DreamLoop.

name: sentinel-security
version: 0.1.0
description: |
  4-layer HDC encoding for security events mapped to MITRE ATT&CK.
  Ada's DreamLoop discovers kill chains that no SIEM rule can find.
  Zero false positives via DONE/ASK confidence gate.

author: Glyphh AI
license: AGPL-3.0

encoder:
  dimensions: 2000
  seed: 42

auto_load_concepts: true

layers:
  tactic:
    weight: 0.35
    roles:
      mitre_tactic:
        type: categorical
        values:
          - none
          - reconnaissance
          - resource_development
          - initial_access
          - execution
          - persistence
          - privilege_escalation
          - defense_evasion
          - credential_access
          - discovery
          - lateral_movement
          - collection
          - command_and_control
          - exfiltration
          - impact

      tactic_signals:
        type: bag_of_words
        weight: 0.8

  technique:
    weight: 0.30
    roles:
      technique_id:
        type: categorical
        values:
          - none
          - phishing
          - spearphishing_attachment
          - command_scripting
          - powershell
          - scheduled_task
          - registry_run_key
          - os_credential_dumping
          - lsass_memory
          - remote_services
          - smb_shares
          - data_staged
          - data_encrypted
          - exfil_over_c2
          - exfil_over_web
          - data_destruction

      technique_signals:
        type: bag_of_words
        weight: 0.8

  source:
    weight: 0.20
    roles:
      event_source:
        type: categorical
        values:
          - unknown
          - endpoint
          - network
          - email
          - dns
          - identity
          - cloud
          - firewall

      source_signals:
        type: bag_of_words
        weight: 0.8

  temporal:
    weight: 0.15
    roles:
      urgency:
        type: numeric
        bin_width: 1.0
        strategy: thermometer
        min: 0.0
        max: 10.0
        weight: 0.7

      severity:
        type: categorical
        values:
          - info
          - low
          - medium
          - high
          - critical

scoring:
  chain_threshold: 0.25
  alert_threshold: 0.40

ada:
  enabled: true
  recall_threshold: 0.30
  system_prompt: "You are Sentinel. Correlate security events. State facts only."
  localized_interval: 2.0
  deep_interval: 10.0
